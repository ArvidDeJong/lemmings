title: Lemmings
description: "darvis/lemmings adds a hidden Lemmings easter egg page to a Laravel application, with a link to the developer's site to prove who built it, and a token protected page that clears the caches without SSH."
url: https://arviddejong.github.io
baseurl: /lemmings

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap

# Facts about the package, used by the structured data and llms.txt.
package:
  name: darvis/lemmings
  repository: https://github.com/ArvidDeJong/lemmings
  packagist: https://packagist.org/packages/darvis/lemmings
  license_url: https://github.com/ArvidDeJong/lemmings/blob/main/LICENSE.md
  requires: "PHP 8.2+, Laravel 11, 12 or 13"
  platforms: [Laravel]
  keywords: [laravel, easter egg, lemmings, developer credit, hidden page, proof of authorship, clear cache without ssh, shared hosting]

# Developer credit in the footer and the structured data.
developer:
  company: ARVID.NL
  url: https://arvid.nl

color_scheme: light
search_enabled: true
heading_anchors: true

aux_links:
  GitHub: https://github.com/ArvidDeJong/lemmings
  Packagist: https://packagist.org/packages/darvis/lemmings
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/ArvidDeJong/lemmings
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: tree

# Social preview image for every page (Open Graph and Twitter card, through jekyll-seo-tag).
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/social-preview.png
